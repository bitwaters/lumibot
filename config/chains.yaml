global:
  live_master_switch: false
  rate_limit:
    capacity: 20
    refill_per_sec: 6
    min_interval_sec: 1.0  # GMGN default limit: 1 req/s; 0 = disable
  enrichment_cache_ttl_sec: 300
  security_cache_ttl_sec: 3600
  price_source: token_info  # token_info | kline
  manage_interval_sec: 5.0        # paper position manage loop interval (s)
  dual_source_ttl_sec: 30.0       # dual-source sighting window (s)
  alerts_per_chain: 5             # /alerts rows per chain
  trending_defer_budget: 4.0      # trending poll defers when limiter budget below this
  ca_query:
    enabled: true
    min_interval_sec: 5.0         # per-chat CA query throttle
    probe_order: [bsc, robinhood] # 0x address probe order among enabled chains
  narrative:
    enabled: true
    base_url: https://api.deepseek.com
    model: deepseek-chat
    timeout_sec: 10
    min_symbol_len: 1  # any symbol eligible (short meme symbols common)
    symbol_blocklist: []
    cache_ttl_sec: 3600

# NOTE: strategy is defined per-chain below (chains.<name>.strategy). There is no
# top-level strategy anymore — each chain's exit/notional behaviour is fully
# independent and lives only in that chain's block.

chains:
  sol:
    enabled: true
    calibration_status: calibrated
    safety_profile: sol_v1
    quote_tokens:
      - symbol: SOL
        address: So11111111111111111111111111111111111111112
      - symbol: USDC
        address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    platforms: []  # empty = allow all; whitelist after observing platform distribution (S4)
    sources:
      signal:
        enabled: true
        interval_sec: 5
        types: [12, 20]
      trending:
        enabled: true
        interval_sec: 20
        window: 1m
      trending_5m:
        enabled: true
        interval_sec: 30
        window: 5m
    filters:
      mc_min: 10000
      mc_max: 50000
      liquidity_min: 8000
      liquidity_ratio_min: 0.20  # liq/mc >= 20%; prevents shallow-pool tokens (report suggested)
      top10_max: 0.25
      holders_min: 100
      visiting_min: 350
      chase_max_pct: 0.05  # one gate for both sources: skip if price ran >5% past payload price
      volume_1h_min: 5000
      volume_mc_ratio_min: 0.05
      age_min_sec: 300    # reject tokens < 2 min old (dev dump risk)
      age_max_sec: 7200   # reject tokens > 2 h old (momentum likely gone); 0 = disabled
      max_mc_extension: 2.0
      enforce_mc_extension: true
    safety:
      rug_max: 0.3
      bundler_max: 0.3
      rat_max: 0.3
      tax_max: 0.05
      strict_missing: true
    cooldown:
      same_type_min: 45
      cross_source_min: 15
    execution:
      mode: paper
      live_enabled: false
      slippage_buy_pct: 0.05
      slippage_sell_pct: 0.05
      limits:
        max_notional_usd: 20
        daily_loss_usd: 50
        daily_trades: 10
        max_concurrent_positions: 3
    strategy:
      notional_usd: 20
      hard_stop_pct: -0.20
      early_stop_pct: -0.15  # entry protection: tighter stop for first 120s
      early_stop_sec: 120
      momentum_sec: 90             # no-momentum exit window
      momentum_activate_pct: 0.02  # must have risen 2% to skip the exit
      momentum_exit_pct: -0.05     # exit when at/below -5% with no momentum
      stage1_tp_pct: 0.25
      stage1_sell_mode: ratio   # ratio | notional; ratio sells a fixed fraction
      stage1_sell_ratio: 0.50   # sell 50% of qty at stage1; trail the remaining 50%
      trail_drawdown_pct: 0.30
      timeout_hours: 2
      snapshots_sec: [60, 300, 900, 3600]
      loss_cooldown_min: 180
      post_close_cooldown_min: 45
      symbol_cooldown_min: 60
      pre_stage1_trail_enable: true
      pre_stage1_trail_activate_pct: 0.05
      pre_stage1_trail_drawdown_pct: 0.20
      timeout_extend_if_profitable: true
      timeout_extend_hours: 1.0
      trail_dynamic: true

  bsc:
    enabled: true
    calibration_status: calibrated
    safety_profile: evm_v1
    quote_tokens:
      - symbol: BNB
        address: "0x0000000000000000000000000000000000000000"
      - symbol: USDC
        address: "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d"
    platforms: []
    sources:
      # Rate-limit pressure (2026-08-05): combined SOL+BSC polling at original
      # rates plus check-script bursts exceeded GMGN quota -> 5-min IP ban.
      # Re-enabled at reduced intervals after SOL recovery (6.4).
      signal:
        enabled: true
        interval_sec: 30
        types: [12, 20]
      trending:

      slippage_buy_pct: 0.08
      slippage_sell_pct: 0.08
      limits:
        max_notional_usd: 20
        daily_loss_usd: 50
        daily_trades: 10
        max_concurrent_positions: 0
    strategy:
      notional_usd: 20
      hard_stop_pct: -0.20
      early_stop_pct: -0.15  # entry protection: tighter stop for first 120s

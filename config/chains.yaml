global:
  live_master_switch: false
  rate_limit:
    capacity: 20
    refill_per_sec: 6
  enrichment_cache_ttl_sec: 300
  security_cache_ttl_sec: 3600
  price_source: token_info  # token_info | kline
  news:
    enabled: false
    poll_sec: 60
    lookback_min: 120
    min_score: 0.6
    edit_timeout_ms: 3000
    min_symbol_len: 3
    symbol_blocklist: []
    market_coins: [SOL, ETH, BTC]
    market_keywords: [meme, meme coin, pump, launch]

# NOTE: strategy is defined per-chain below (chains.<name>.strategy). There is no
# top-level strategy anymore — each chain's exit/notional behaviour is fully
# independent and lives only in that chain's block.

chains:
  sol:
    enabled: true
    calibration_status: calibrated
    safety_profile: sol_v1
    quote_tokens:
      - symbol: SOL
        address: So11111111111111111111111111111111111111112
      - symbol: USDC
        address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    platforms: []  # empty = allow all; whitelist after observing platform distribution (S4)
    sources:
      signal:
        enabled: true
        interval_sec: 5
        types: [12, 20]
      trending:
        enabled: true
        interval_sec: 20
        window: 1m
      trending_5m:
        enabled: true
        interval_sec: 30
        window: 5m
    filters:
      mc_min: 10000
      mc_max: 50000
      liquidity_min: 8000
      liquidity_ratio_min: 0.20  # liq/mc >= 20%; prevents shallow-pool tokens (report suggested)
      top10_max: 0.25
      holders_min: 100
      visiting_min: 200
      visiting_min_trending: 250  # trending payload can lag; require slightly higher heat (S6)
      volume_1h_min: 5000
      volume_mc_ratio_min: 0.05
      age_min_sec: 120    # reject tokens < 2 min old (dev dump risk)
      age_max_sec: 7200   # reject tokens > 2 h old (momentum likely gone); 0 = disabled
      max_mc_extension: 2.0
      enforce_mc_extension: true
    safety:
      rug_max: 0.3
      bundler_max: 0.3
      rat_max: 0.3
      tax_max: 0.05
      strict_missing: true
    cooldown:
      same_type_min: 45
      cross_source_min: 15
    execution:
      mode: paper
      live_enabled: false
      slippage_buy_pct: 0.05
      slippage_sell_pct: 0.05
      limits:
        max_notional_usd: 20
        daily_loss_usd: 50
        daily_trades: 10
        max_concurrent_positions: 3
    strategy:
      notional_usd: 20
      hard_stop_pct: -0.30
      stage1_tp_pct: 0.25
      stage1_sell_mode: ratio   # ratio | notional; ratio sells a fixed fraction
      stage1_sell_ratio: 0.50   # sell 50% of qty at stage1; trail the remaining 50%
      trail_drawdown_pct: 0.30
      timeout_hours: 2
      snapshots_sec: [60, 300, 900, 3600]
      loss_cooldown_min: 180
      post_close_cooldown_min: 45
      pre_stage1_trail_enable: true
      pre_stage1_trail_activate_pct: 0.15
      pre_stage1_trail_drawdown_pct: 0.40
      timeout_extend_if_profitable: true
      timeout_extend_hours: 1.0
      trail_dynamic: true


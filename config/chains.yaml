      stage1_tp_pct: 0.25
      stage1_sell_mode: ratio
      stage1_sell_ratio: 0.50
      trail_drawdown_pct: 0.30
      timeout_hours: 2
      snapshots_sec: [60, 300, 900, 3600]
      loss_cooldown_min: 180
      post_close_cooldown_min: 45
      symbol_cooldown_min: 60
      pre_stage1_trail_enable: true
      pre_stage1_trail_activate_pct: 0.05
      pre_stage1_trail_drawdown_pct: 0.20
      timeout_extend_if_profitable: false
      timeout_extend_hours: 1.0
      trail_dynamic: true

  robinhood:
    enabled: true
    calibration_status: calibrated
    safety_profile: evm_v1
    quote_tokens:
      - symbol: NATIVE
        address: "0x0000000000000000000000000000000000000000"
      - symbol: WETH
        address: "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
    platforms: []
    sources:
      # Reduced intervals like bsc: shared GMGN quota is 1 req/s (6.4).
      signal:
        enabled: true
        interval_sec: 30
        types: [12, 20]
      trending:
        enabled: true
        interval_sec: 120
        window: 1m
    filters:
      mc_min: 5000
      mc_max: 50000
      liquidity_min: 5000
      liquidity_ratio_min: 0.15
      top10_max: 0.30
      holders_min: 80
      visiting_min: 200
      chase_max_pct: 0.10  # one gate for both sources: skip if price ran >10% past payload price
      volume_1h_min: 0
      volume_mc_ratio_min: 0
      age_min_sec: 300

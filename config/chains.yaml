      momentum_sec: 90             # no-momentum exit window
      momentum_activate_pct: 0.02  # must have risen 2% to skip the exit
      momentum_exit_pct: -0.05     # exit when at/below -5% with no momentum
      stage1_tp_pct: 0.25
      stage1_sell_mode: ratio

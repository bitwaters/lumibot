global:
  live_master_switch: false
  rate_limit:
    capacity: 20
    refill_per_sec: 6
  enrichment_cache_ttl_sec: 300
  price_source: token_info  # token_info | kline

strategy:
  notional_usd: 20
  hard_stop_pct: -0.50
  stage1_tp_pct: 0.30
  trail_drawdown_pct: 0.50
  timeout_hours: 4
  snapshots_sec: [60, 300, 900, 3600]
  loss_cooldown_min: 180
  post_close_cooldown_min: 45

chains:
  sol:
    enabled: true
    calibration_status: calibrated
    safety_profile: sol_v1
    quote_tokens:
      - symbol: SOL
        address: So11111111111111111111111111111111111111112
      - symbol: USDC
        address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    platforms: []
    sources:
      signal:
        enabled: true
        interval_sec: 5
        types: [12, 20]
      trending:
        enabled: true
        interval_sec: 20
        window: 1m
    filters:
      mc_min: 1000
      mc_max: 50000
      liquidity_min: 5000
      top10_max: 0.30
      holders_min: 100
      visiting_min: 100
      max_mc_extension: 2.0
      enforce_mc_extension: false
    safety:
      rug_max: 0.3
      bundler_max: 0.3
      rat_max: 0.3
      tax_max: 0.05
    cooldown:
      same_type_min: 45
      cross_source_min: 15
    execution:
      mode: paper
      live_enabled: false
      slippage_buy_pct: 0.05
      slippage_sell_pct: 0.05
      limits:
        max_notional_usd: 20
        daily_loss_usd: 50
        daily_trades: 10

  bsc:
